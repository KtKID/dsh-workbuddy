name: Check and Release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          assert.match(version, /^\d+\.\d+\.\d+$/);
          assert.equal(process.env.RELEASE_TAG, `v${version}`);
          NODE
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - run: pnpm pack --pack-destination dist
      - name: Prepare release assets
        working-directory: dist
        run: |
          VERSION="$(node -p 'require("../package.json").version')"
          cp "dsh-workbuddy-${VERSION}.tgz" dsh-workbuddy.tgz
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-workbuddy
          path: |
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error

  compatibility:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: [0.2.1-rc.2, 0.2.2-alpha.2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/fixtures/dsh-0.2.1-rc.2-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dsh-workbuddy
          path: dist
      - name: Verify release artifact on DSH ${{ matrix.dsh }}
        run: node scripts/verify-compatibility.mjs '${{ matrix.dsh }}' dist/dsh-workbuddy.tgz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-workbuddy
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "dist/dsh-workbuddy-${VERSION}.tgz" dist/dsh-workbuddy.tgz dist/SHA256SUMS \
            --verify-tag \
            --title "dsh-workbuddy $RELEASE_TAG" \
            --generate-notes \
            --notes "同一预构建安装包通过 GitHub Actions 的构建、类型、格式及两套 DSH 兼容回归。Node.js >=24.9.0；支持的 DSH 版本和验证范围见 https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs/compatibility.md 。安装与平台配置见 README.md 和 docs/usage.md。SHA256SUMS 提供安装包校验值。"
